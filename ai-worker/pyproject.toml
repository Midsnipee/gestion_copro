[project]
name = "gestion-copro-ai-worker"
version = "0.1.0"
description = "Worker IA : rédaction, ingestion documentaire, chatbot (OpenRouter)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
